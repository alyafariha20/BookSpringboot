<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Anggota</title>
</head>
<body>
<h1>Daftar Anggota</h1>

<p th:if="${pesan}" th:text="${pesan}" style="color:#b00020">Pesan error</p>

<p th:if="${#lists.isEmpty(daftarAnggota)}">Belum ada anggota.</p>

<table border="1" th:unless="${#lists.isEmpty(daftarAnggota)}">
    <tr><th>ID</th><th>Nama</th><th>Batas Pinjam</th></tr>
    <tr th:each="a : ${daftarAnggota}">
        <td th:text="${a.idAnggota}">A001</td>
        <td th:text="${a.nama}">Nama</td>
        <td th:text="${a.batasPinjam}">0</td>
    </tr>
</table>

<h2>Tambah Anggota</h2>
<form th:action="@{/anggota}" method="post">
    <input name="idAnggota" placeholder="ID (mis. A003)" maxlength="10" required>
    <input name="nama" placeholder="Nama" maxlength="100" required>
    <input name="batasPinjam" type="number" min="1" value="2">
    <button type="submit">Simpan</button>
</form>

<hr>
<a th:href="@{/buku}">← Ke Daftar Buku</a>

<hr>
<a th:href="@{/anggota}">Lihat Anggota</a>
</body>
</html>
